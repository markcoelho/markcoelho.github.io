<!doctype HTML>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="js/aframe.min.js"></script>
    <script src="js/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            font-family: Arial, sans-serif;
        }

        .a-canvas {
            position: absolute !important;
            z-index: 1 !important;
        }

        .a-enter-vr {
            z-index: 9999 !important;
        }
    </style>
</head>

<body>

<a-scene
    renderer="antialias: true; physicallyCorrectLights: true; colorManagement: true;"
    vr-mode-ui="enabled: true;"
    arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
>

    <!-- LIGHTING (makes hologram look real) -->
    <a-entity light="type: ambient; intensity: 0.75"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

    <!-- VIDEO PASSTHROUGH -->
    <a-video id="arjs_feed" position="0 0 -20" width="22" height="22"></a-video>

    <!-- BUSINESS CARD MARKER -->
    <!-- BUSINESS CARD MARKER -->
<a-marker type="barcode" value="1">

    <!-- Real card representation (thin outline only, so it doesn’t cover IRL card) -->
    <a-plane 
        width="1.6" height="0.9"
        color="#ffffff"
        opacity="0.05"
        rotation="-90 0 0"
        position="0 0.02 0">
    </a-plane>

    <!-- TOP FLOATING PANEL (name/title) -->
    <a-entity position="0 0.35 0" scale="0 0 0"
              animation__scale="property: scale; to: 1 1 1; dur: 450; easing: easeOutBack">

        <a-plane width="1.6" height="0.35"
                 color="#111827" opacity="0.85"
                 rotation="-90 0 0" position="0 0 0.0">
        </a-plane>

        <a-text value="John Smith"
                color="white" width="1.4"
                position="-0.7 0 0.10" rotation="-90 0 0">
        </a-text>

        <a-text value="CEO & Founder"
                color="#60a5fa" width="1.4"
                position="-0.7 0 -0.02"
                scale="0.7 0.7 0.7"
                rotation="-90 0 0">
        </a-text>

    </a-entity>

    <!-- RIGHT PANEL (social icons) -->
    <a-entity position="1.0 0.15 0" scale="0 0 0"
              animation__scale="property: scale; to: 1 1 1; dur: 400; easing: easeOutBack">

        <a-plane width="0.45" height="0.9"
                 color="#1f2937" opacity="0.85"
                 rotation="-90 -90 0">
        </a-plane>

        <a-image src="linkedin.png" width="0.25" height="0.25"
                 position="0 0 0.3" rotation="-90 -90 0"></a-image>

        <a-image src="twitter.png" width="0.25" height="0.25"
                 position="0 0 0" rotation="-90 -90 0"></a-image>

        <a-image src="instagram.png" width="0.25" height="0.25"
                 position="0 0 -0.3" rotation="-90 -90 0"></a-image>

    </a-entity>

    <!-- LEFT PANEL (contact info) -->
    <a-entity position="-1.0 0.12 0" scale="0 0 0"
              animation__scale="property: scale; to: 1 1 1; dur: 400; easing: easeOutBack">

        <a-plane width="0.55" height="0.9"
                 color="#1f2937" opacity="0.85"
                 rotation="-90 90 0">
        </a-plane>

        <a-text value="📞 +1 (555) 123-4567"
                width="0.8" color="white"
                position="-0.25 0 0.25"
                rotation="-90 90 0"
                scale="0.55 0.55 0.55">
        </a-text>

        <a-text value="✉️ john@company.com"
                width="0.8" color="white"
                position="-0.25 0 0.05"
                rotation="-90 90 0"
                scale="0.55 0.55 0.55">
        </a-text>

        <a-text value="🌐 company.com"
                width="0.8" color="white"
                position="-0.25 0 -0.15"
                rotation="-90 90 0"
                scale="0.55 0.55 0.55">
        </a-text>

    </a-entity>

    <!-- BOTTOM PANEL (video) -->
    <a-entity position="0 -0.35 0" scale="0 0 0"
              animation__scale="property: scale; to: 1 1 1; dur: 450; easing: easeOutBack">

        <a-plane width="1.8" height="0.9"
                 rotation="-90 0 0"
                 color="#0f172a" opacity="0.85"></a-plane>

        <a-video src="#video-placeholder"
                 width="1.6" height="0.7"
                 rotation="-90 0 0"
                 position="0 0 0.01"></a-video>

    </a-entity>

</a-marker>


    <a-camera></a-camera>

    <!-- PASSTHROUGH FIX -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const cam = document.getElementById("arjs-video");
                if (cam && cam.srcObject) {
                    const feed = document.getElementById("arjs_feed");
                    feed.srcObject = cam.srcObject;
                    feed.setAttribute("src", "#arjs-video");
                }
            }, 3000);
        });
    </script>

</a-scene>
</body>
</html>
