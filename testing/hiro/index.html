<!doctype HTML>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="js/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="js/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: monospace;
        }

        .a-canvas {
            z-index: 1 !important;
            position: absolute !important;
        }
        
        .a-enter-vr {
            z-index: 2 !important;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

<a-scene renderer="sortObjects: true" vr-mode-ui="enabled: true;" arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets>
        <a-asset-item id="lrbox" src="models/lrbox.gltf"></a-asset-item>
	</a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">

        <a-entity cursor="fuse: true; fuseTimeout: 500"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.002; radiusOuter: 0.004"
            material="color: red; shader: flat">
        </a-entity>
        
        <!-- Raycaster entity attached to camera -->
        <a-entity id="raycaster" 
                  raycaster="objects: .zoom-button, #outsidecamera, .scroller; showLine: false; lineColor: red; far: 20"
                  position="0 0 0"
                  visible-in-vr-only></a-entity>
                  
        <a-video opacity="1" id="arjs_feed" position="0 0 -50" width="83" height="83"></a-video>

        <!-- Markers with zoom controls -->
        <a-marker type="barcode" value="1">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

        <a-marker type="barcode" value="2">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

        <a-marker type="barcode" value="3">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

        <a-marker type="barcode" value="4">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 -1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

    </a-camera>

    <!-- CENTERPIECE - Parent entity containing both image and scrollers -->
    <a-entity id="centerpiece" position="0 0 -5" rotation="0 0 0">
        <!-- Image as child -->
        <a-image id="outsidecamera" src="boiler.jpg" position="0 0 0" scale="3 3 3">
        </a-image>
        
        <!-- Scrollers as children -->
        <a-entity id="scrollers">
            <!-- Top scroller -->
            <a-plane class="scroller" id="scroller-top" 
                     position="0 5 -0.2" 
                     rotation="0 0 0" 
                     width="15" height="5" 
                     color="#1E90FF" 
                     opacity="0"
                     data-direction="down">
            </a-plane>
            
            <!-- Right scroller -->
            <a-plane class="scroller" id="scroller-right" 
                     position="5 0 -0.2" 
                     rotation="0 0 0" 
                     width="5" height="15" 
                     color="#1E90FF" 
                     opacity="0"
                     data-direction="left">
            </a-plane>
            
            <!-- Bottom scroller -->
            <a-plane class="scroller" id="scroller-bottom" 
                     position="0 -5 -0.2" 
                     rotation="0 0 0" 
                     width="15" height="5" 
                     color="#1E90FF" 
                     opacity="0"
                     data-direction="up">
            </a-plane>
            
            <!-- Left scroller -->
            <a-plane class="scroller" id="scroller-left" 
                     position="-5 0 -0.2" 
                     rotation="0 0 0" 
                     width="5" height="15" 
                     color="#1E90FF" 
                     opacity="0"
                     data-direction="right">
            </a-plane>
        </a-entity>
    </a-entity>

    <script>
    // DOUBLE INTERSECTION CONTINUOUS MOVEMENT COMPONENT
    AFRAME.registerComponent('double-intersection-controls', {
        init: function() {
            this.centerpiece = document.getElementById('centerpiece');
            this.outsideCamera = document.getElementById('outsidecamera');
            this.scrollerElements = document.querySelectorAll('.scroller');
            
            this.isImageIntersected = false;
            this.activeScrollers = new Set(); // Track multiple active scrollers
            this.moveInterval = null;
            this.moveDistance = 0.1;
            this.moveSpeed = 50; // milliseconds between movements
            
            console.log('Double intersection controls initialized');
            
            // Listen for image intersection
            this.outsideCamera.addEventListener('raycaster-intersected', () => {
                this.isImageIntersected = true;
                console.log('Image intersected');
                this.checkForDoubleIntersection();
            });
            
            this.outsideCamera.addEventListener('raycaster-intersected-cleared', () => {
                this.isImageIntersected = false;
                console.log('Image intersection cleared');
                this.stopMovement();
            });
            
            // Add intersection listeners to all scrollers
            this.scrollerElements.forEach(scroller => {
                scroller.addEventListener('raycaster-intersected', (evt) => {
                    this.handleScrollerIntersected(evt.target);
                });
                
                scroller.addEventListener('raycaster-intersected-cleared', (evt) => {
                    this.handleScrollerCleared(evt.target);
                });
            });
        },
        
        handleScrollerIntersected: function(scroller) {
            this.activeScrollers.add(scroller.id);
            console.log(`Scroller ${scroller.id} intersected. Active scrollers:`, Array.from(this.activeScrollers));
            this.checkForDoubleIntersection();
        },
        
        handleScrollerCleared: function(scroller) {
            this.activeScrollers.delete(scroller.id);
            console.log(`Scroller ${scroller.id} cleared. Active scrollers:`, Array.from(this.activeScrollers));
            
            if (this.activeScrollers.size === 0) {
                this.stopMovement();
            }
        },
        
        checkForDoubleIntersection: function() {
            // Only start movement if BOTH image and at least one scroller are intersected
            if (this.isImageIntersected && this.activeScrollers.size > 0 && !this.moveInterval) {
                console.log(`DOUBLE INTERSECTION: Image and ${Array.from(this.activeScrollers)} - starting continuous movement`);
                this.startMovement();
            }
        },
        
        startMovement: function() {
            this.moveInterval = setInterval(() => {
                this.continuousMove();
            }, this.moveSpeed);
        },
        
        stopMovement: function() {
            if (this.moveInterval) {
                console.log('Stopping movement');
                clearInterval(this.moveInterval);
                this.moveInterval = null;
            }
        },
        
        continuousMove: function() {
            if (!this.outsideCamera || this.activeScrollers.size === 0 || !this.isImageIntersected) {
                this.stopMovement();
                return;
            }
            
            const currentImagePosition = this.outsideCamera.getAttribute('position');
            let newImagePosition = {...currentImagePosition};
            
            // Calculate movement for each active scroller
            let moveX = 0;
            let moveY = 0;
            
            // Check each possible scroller and accumulate movement
            if (this.activeScrollers.has('scroller-top')) {
                moveY -= this.moveDistance; // DOWN
            }
            if (this.activeScrollers.has('scroller-right')) {
                moveX -= this.moveDistance; // LEFT
            }
            if (this.activeScrollers.has('scroller-bottom')) {
                moveY += this.moveDistance; // UP
            }
            if (this.activeScrollers.has('scroller-left')) {
                moveX += this.moveDistance; // RIGHT
            }
            
            // Apply combined movement
            newImagePosition.x = currentImagePosition.x + moveX;
            newImagePosition.y = currentImagePosition.y + moveY;
            
            // Update ONLY the image position (scrollers stay fixed relative to centerpiece)
            this.outsideCamera.setAttribute('position', newImagePosition);
            
            // Log diagonal movement if applicable
            if (moveX !== 0 && moveY !== 0) {
                const direction = this.getDiagonalDirection(moveX, moveY);
                console.log(`Diagonal movement: ${direction}`);
            }
        },
        
        getDiagonalDirection: function(moveX, moveY) {
            if (moveX > 0 && moveY > 0) return "UP-RIGHT";
            if (moveX > 0 && moveY < 0) return "DOWN-RIGHT";
            if (moveX < 0 && moveY > 0) return "UP-LEFT";
            if (moveX < 0 && moveY < 0) return "DOWN-LEFT";
            return "UNKNOWN";
        },
        
        remove: function() {
            // Clean up interval when component is removed
            if (this.moveInterval) {
                clearInterval(this.moveInterval);
            }
        }
    });

    // SMOOTH CONTINUOUS ZOOM COMPONENT
    AFRAME.registerComponent('smooth-zoom-controls', {
        init: function() {
            this.outsideCamera = document.getElementById('outsidecamera');
            this.zoomButtons = document.querySelectorAll('.zoom-button');
            
            this.activeZoomButton = null;
            this.zoomInterval = null;
            this.zoomSpeed = 100; // milliseconds between zoom steps
            this.zoomIncrement = 1; // Smaller increment for smoother zoom
            
            console.log('Smooth zoom controls initialized');
            
            // Add intersection listeners to all zoom buttons
            this.zoomButtons.forEach(button => {
                button.addEventListener('raycaster-intersected', (evt) => {
                    this.handleZoomButtonIntersected(evt.target);
                });
                
                button.addEventListener('raycaster-intersected-cleared', (evt) => {
                    this.handleZoomButtonCleared(evt.target);
                });
            });
        },
        
        handleZoomButtonIntersected: function(button) {
            // Stop any existing zoom
            if (this.zoomInterval) {
                clearInterval(this.zoomInterval);
                this.zoomInterval = null;
            }
            
            this.activeZoomButton = button;
            const action = button.getAttribute('data-action');
            console.log(`Zoom button ${action} intersected - starting continuous zoom`);
            this.startZoom(action);
        },
        
        handleZoomButtonCleared: function(button) {
            if (this.activeZoomButton === button) {
                console.log(`Zoom button cleared - stopping zoom`);
                this.activeZoomButton = null;
                this.stopZoom();
            }
        },
        
        startZoom: function(action) {
            this.zoomInterval = setInterval(() => {
                this.continuousZoom(action);
            }, this.zoomSpeed);
        },
        
        stopZoom: function() {
            if (this.zoomInterval) {
                console.log('Stopping zoom');
                clearInterval(this.zoomInterval);
                this.zoomInterval = null;
            }
        },
        
        continuousZoom: function(action) {
            if (!this.outsideCamera || !this.activeZoomButton) {
                this.stopZoom();
                return;
            }
            
            const currentScale = this.outsideCamera.getAttribute('scale');
            const currentScaleValue = currentScale.x;
            
            let newScaleValue;
            if (action === 'increase') {
                newScaleValue = currentScaleValue + this.zoomIncrement;
            } else {
                newScaleValue = Math.max(0.1, currentScaleValue - this.zoomIncrement);
            }
            
            // Apply new scale
            this.outsideCamera.setAttribute('scale', {
                x: newScaleValue,
                y: newScaleValue, 
                z: newScaleValue
            });
        },
        
        remove: function() {
            // Clean up interval when component is removed
            if (this.zoomInterval) {
                clearInterval(this.zoomInterval);
            }
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const camera = document.querySelector('a-camera');

        // Add SMOOTH ZOOM controls component to scene
        const scene = document.querySelector('a-scene');
        scene.setAttribute('smooth-zoom-controls', '');
        
        // Add DOUBLE INTERSECTION scroller controls component to scene
        scene.setAttribute('double-intersection-controls', '');

        console.log('All components initialized');

        // Handle marker detection
        const markers = document.querySelectorAll('a-marker');
        markers.forEach(marker => {
            marker.addEventListener('markerFound', (e) => {
                const markerValue = marker.getAttribute('value');
                console.log(`marker ${markerValue} visible`);
                
                // Get marker's world position and camera's world position
                const markerWorldPos = getWorldPosition(marker);
                const cameraWorldPos = getWorldPosition(camera);
                
                // Create vectors for XZ plane only (ignore Y)
                const markerXZ = new THREE.Vector3(markerWorldPos.x, 0, markerWorldPos.z);
                const cameraXZ = new THREE.Vector3(cameraWorldPos.x, 0, cameraWorldPos.z);
                
                // Calculate direction vector from camera to marker on XZ plane only
                const direction = new THREE.Vector3();
                direction.subVectors(markerXZ, cameraXZ).normalize();
                
                // Calculate position 5 units beyond the marker in the same XZ direction
                const centerpiecePosition = new THREE.Vector3();
                centerpiecePosition.copy(markerXZ);
                centerpiecePosition.add(direction.multiplyScalar(5));
                
                // Calculate rotation to face the camera
                const lookDirection = new THREE.Vector3();
                lookDirection.subVectors(cameraXZ, centerpiecePosition).normalize();
                const angle = Math.atan2(lookDirection.x, lookDirection.z);
                const yRotation = THREE.Math.radToDeg(angle);
                
                // Update centerpiece (parent of both image and scrollers)
                const centerpiece = document.getElementById('centerpiece');
                
                if (centerpiece) {
                    // Change image source based on marker value
                    const outsideCamera = document.getElementById('outsidecamera');
                    const imageSources = {
                        '1': 'boiler.jpg',
                        '2': 'frame_plan.jpg', 
                        '3': 'main_forecastle_deck.jpg',
                        '4': 'profile.jpg'
                    };
                    
                    if (outsideCamera && imageSources[markerValue]) {
                        outsideCamera.setAttribute('src', imageSources[markerValue]);
                    }
                    
                    // Set position and rotation to face camera (applies to entire centerpiece)
                    centerpiece.setAttribute('position', {
                        x: centerpiecePosition.x,
                        y: 0,
                        z: centerpiecePosition.z
                    });

                    centerpiece.setAttribute('rotation', {
                        x: 0,
                        y: yRotation,
                        z: 0
                    });
                    
                    console.log(`Centerpiece positioned at:`, centerpiecePosition);
                    console.log(`Centerpiece rotation Y: ${yRotation} degrees`);
                }
            });
            
            marker.addEventListener('markerLost', (e) => {
                console.log(`marker ${marker.getAttribute('value')} lost`);
            });
        });
        
        // Handle AR video feed
        setTimeout(() => {
            const arjsVideo = document.getElementById("arjs-video");
            if (arjsVideo && arjsVideo.srcObject) {
                const arFeed = document.getElementById('arjs_feed');
                arFeed.srcObject = arjsVideo.srcObject;
                arFeed.setAttribute('src', '#arjs-video');
            }
        }, 3000);
    });

    function getWorldPosition(entity) {
        const position = new THREE.Vector3();
        entity.object3D.getWorldPosition(position);
        return position;
    }

    function getWorldRotation(entity) {
        const rotation = new THREE.Euler();
        const quaternion = new THREE.Quaternion();
        entity.object3D.getWorldQuaternion(quaternion);
        rotation.setFromQuaternion(quaternion);
        
        return {
            x: THREE.Math.radToDeg(rotation.x),
            y: THREE.Math.radToDeg(rotation.y),
            z: THREE.Math.radToDeg(rotation.z)
        };
    }
</script>

</a-scene>
</body>
</html>
