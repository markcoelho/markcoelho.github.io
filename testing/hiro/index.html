<!doctype HTML>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="js/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="js/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: monospace;
        }

        .a-canvas {
            z-index: 1 !important;
            position: absolute !important;
        }
        
        .a-enter-vr {
            z-index: 2 !important;
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

<a-scene renderer="sortObjects: true" vr-mode-ui="enabled: true;" arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets>
        <a-asset-item id="lrbox" src="models/lrbox.gltf"></a-asset-item>
	</a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">

        <a-entity cursor="fuse: true; fuseTimeout: 500"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.002; radiusOuter: 0.004"
            material="color: red; shader: flat">
        </a-entity>
        
        <!-- Raycaster entity attached to camera -->
        <a-entity id="raycaster" 
                  raycaster="objects: .zoom-button, #outsidecamera, #scrollring; showLine: false; lineColor: red; far: 20"
                  position="0 0 0"
                  visible-in-vr-only></a-entity>
                  
        <a-video opacity="1" id="arjs_feed" position="0 0 -50" width="83" height="83"></a-video>

        <!-- Markers with zoom controls -->
        <a-marker type="barcode" value="1">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

        <a-marker type="barcode" value="2">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

        <a-marker type="barcode" value="3">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

        <a-marker type="barcode" value="4">
            <a-image class="zoom-button" src="plus.png" position="1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="increase"></a-image>
            <a-image class="zoom-button" src="minus.png" position="-1 0.5 1.3" rotation="-90 0 0" scale="0.3 0.3 0.3" data-action="decrease"></a-image>
        </a-marker>

    </a-camera>

    <a-image position="0 0 -5" id="outsidecamera" src="boiler.jpg" rotation="0 0 0" scale="3 3 3">
    </a-image>
    
    <!-- Scroll ring now outside of outsidecamera but will sync with it -->
    <a-ring id="scrollring" opacity="0.3" position="0 0 -5" color="teal" radius-inner="0.3" radius-outer="1" scale="3 3 3"> </a-ring>

    <script>
    // Component to sync scrollring with outsidecamera
    AFRAME.registerComponent('sync-with-image', {
        schema: {
            target: {type: 'selector'}
        },
        
        init: function() {
            this.target = this.data.target;
            if (!this.target) return;
            
            // Initial sync
            this.syncTransform();
            
            // Listen for changes to the target
            this.target.addEventListener('componentchanged', (evt) => {
                if (evt.detail.name === 'position' || 
                    evt.detail.name === 'rotation' || 
                    evt.detail.name === 'scale') {
                    this.syncTransform();
                }
            });
        },
        
        syncTransform: function() {
            const position = this.target.getAttribute('position');
            const rotation = this.target.getAttribute('rotation');
            const scale = this.target.getAttribute('scale');
            
            this.el.setAttribute('position', position);
            this.el.setAttribute('rotation', rotation);
            this.el.setAttribute('scale', scale);
        }
    });

    // Simple zoom component for the outsidecamera image
    AFRAME.registerComponent('zoom-controls', {
        init: function() {
            this.scaleFactor = 2;
            this.outsideCamera = document.getElementById('outsidecamera');
            this.scrollring = document.getElementById('scrollring');
            
            // Add click event to all zoom buttons
            const zoomButtons = document.querySelectorAll('.zoom-button');
            zoomButtons.forEach(button => {
                button.addEventListener('raycaster-intersected', (evt) => {
                    const action = button.getAttribute('data-action');
                    this.zoomImage(action);
                });
            });
        },
        
        zoomImage: function(action) {
            if (!this.outsideCamera) return;
            
            const currentScale = this.outsideCamera.getAttribute('scale');
            const scaleChange = action === 'increase' ? this.scaleFactor : -this.scaleFactor;
            
            const newScaleValue = Math.max(0.1, currentScale.x + scaleChange);
            
            this.outsideCamera.setAttribute('scale', {
                x: newScaleValue,
                y: newScaleValue, 
                z: newScaleValue
            });
            
        }
    });

    // Component to handle movement when both outsidecamera and scrollring are intersected
    AFRAME.registerComponent('double-intersection-move', {
        init: function() {
            this.outsideCamera = document.getElementById('outsidecamera');
            this.scrollring = document.getElementById('scrollring');
            this.raycaster = document.getElementById('raycaster');
            
            this.intersectedObjects = new Set();
            this.hasMoved = false;
            
            // Listen for intersection events
            this.outsideCamera.addEventListener('raycaster-intersected', this.handleIntersection.bind(this));
            this.scrollring.addEventListener('raycaster-intersected', this.handleIntersection.bind(this));
            
            // Listen for intersection cleared events
            this.outsideCamera.addEventListener('raycaster-intersected-cleared', this.handleIntersectionCleared.bind(this));
            this.scrollring.addEventListener('raycaster-intersected-cleared', this.handleIntersectionCleared.bind(this));
        },
        
        handleIntersection: function(evt) {
            this.intersectedObjects.add(evt.target.id);
            this.checkForDoubleIntersection();
        },
        
        handleIntersectionCleared: function(evt) {
            this.intersectedObjects.delete(evt.target.id);
            this.hasMoved = false; // Reset so we can move again next time
        },
        
        checkForDoubleIntersection: function() {
            // Check if both outsidecamera and scrollring are intersected
            if (this.intersectedObjects.has('outsidecamera') && 
                this.intersectedObjects.has('scrollring') && 
                !this.hasMoved) {
                
                this.moveCameraLeft();
                this.hasMoved = true;
            }
        },
        
        moveCameraLeft: function() {
            if (!this.outsideCamera) return;
            
            const currentPosition = this.outsideCamera.getAttribute('position');
            const currentRotation = this.outsideCamera.getAttribute('rotation');
            
            // Get the image's Y rotation in radians
            const yRotationRad = THREE.Math.degToRad(currentRotation.y);
            
            // Calculate the left direction vector relative to the image's orientation
            // For an image facing the camera, left is -90 degrees from its forward direction
            const leftDirection = new THREE.Vector3(
                -Math.cos(yRotationRad),  // X component
                0,                        // Y component (no vertical movement)
                Math.sin(yRotationRad)    // Z component
            );
            
            // Normalize and scale by 0.5 units
            leftDirection.normalize().multiplyScalar(0.5);
            
            // Calculate new position
            const newPosition = {
                x: currentPosition.x + leftDirection.x,
                y: currentPosition.y,
                z: currentPosition.z + leftDirection.z
            };
            
            this.outsideCamera.setAttribute('position', newPosition);
            
            console.log('Moved outsidecamera left by 0.5 units relative to its orientation');
            console.log('Image rotation Y:', currentRotation.y, 'degrees');
            console.log('Left direction:', leftDirection);
            console.log('New position:', newPosition);
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const camera = document.querySelector('a-camera');

        // Add zoom controls component to scene
        const scene = document.querySelector('a-scene');
        scene.setAttribute('zoom-controls', '');
        
        // Add sync component to scrollring
        const scrollring = document.getElementById('scrollring');
        const outsideCamera = document.getElementById('outsidecamera');
        scrollring.setAttribute('sync-with-image', 'target: #outsidecamera');
        
        // Add double intersection move component to scene
        scene.setAttribute('double-intersection-move', '');

        // Handle marker detection
        const markers = document.querySelectorAll('a-marker');
        markers.forEach(marker => {
            marker.addEventListener('markerFound', (e) => {
                const markerValue = marker.getAttribute('value');
                console.log(`marker ${markerValue} visible`);
                
                // Get marker's world position and camera's world position
                const markerWorldPos = getWorldPosition(marker);
                const cameraWorldPos = getWorldPosition(camera);
                
                // Create vectors for XZ plane only (ignore Y)
                const markerXZ = new THREE.Vector3(markerWorldPos.x, 0, markerWorldPos.z);
                const cameraXZ = new THREE.Vector3(cameraWorldPos.x, 0, cameraWorldPos.z);
                
                // Calculate direction vector from camera to marker on XZ plane only
                const direction = new THREE.Vector3();
                direction.subVectors(markerXZ, cameraXZ).normalize();
                
                // Calculate position 5 units beyond the marker in the same XZ direction
                const imagePosition = new THREE.Vector3();
                imagePosition.copy(markerXZ);
                imagePosition.add(direction.multiplyScalar(5));
                
                // Calculate rotation to face the camera
                const lookDirection = new THREE.Vector3();
                lookDirection.subVectors(cameraXZ, imagePosition).normalize();
                const angle = Math.atan2(lookDirection.x, lookDirection.z);
                const yRotation = THREE.Math.radToDeg(angle);
                
                // Update outsidecamera image
                if (outsideCamera) {
                    // Change image source based on marker value
                    const imageSources = {
                        '1': 'boiler.jpg',
                        '2': 'frame_plan.jpg', 
                        '3': 'main_forecastle_deck.jpg',
                        '4': 'profile.jpg'
                    };
                    
                    if (imageSources[markerValue]) {
                        outsideCamera.setAttribute('src', imageSources[markerValue]);
                    }
                    
                    // Set position and rotation to face camera
                    outsideCamera.setAttribute('position', {
                        x: imagePosition.x,
                        y: 0,
                        z: imagePosition.z
                    });

                    outsideCamera.setAttribute('rotation', {
                        x: 0,
                        y: yRotation,
                        z: 0
                    });
                    
                    console.log(`Image positioned at:`, imagePosition);
                    console.log(`Image rotation Y: ${yRotation} degrees`);
                }
            });
            
            marker.addEventListener('markerLost', (e) => {
                console.log(`marker ${marker.getAttribute('value')} lost`);
            });
        });
        
        // Handle AR video feed
        setTimeout(() => {
            const arjsVideo = document.getElementById("arjs-video");
            if (arjsVideo && arjsVideo.srcObject) {
                const arFeed = document.getElementById('arjs_feed');
                arFeed.srcObject = arjsVideo.srcObject;
                arFeed.setAttribute('src', '#arjs-video');
            }
        }, 3000);
    });

    function getWorldPosition(entity) {
        const position = new THREE.Vector3();
        entity.object3D.getWorldPosition(position);
        return position;
    }

    function getWorldRotation(entity) {
        const rotation = new THREE.Euler();
        const quaternion = new THREE.Quaternion();
        entity.object3D.getWorldQuaternion(quaternion);
        rotation.setFromQuaternion(quaternion);
        
        return {
            x: THREE.Math.radToDeg(rotation.x),
            y: THREE.Math.radToDeg(rotation.y),
            z: THREE.Math.radToDeg(rotation.z)
        };
    }
</script>

</a-scene>
</body>
</html>
