
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: monospace;
        }

  
        .a-canvas {
            z-index: 1 !important;
            position: absolute !important;
        }
        
    </style>


  </head>
  <body>
    <a-scene renderer="sortObjects: true" mindar-image="imageTargetSrc: target1.mind;" vr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="lrbox" src="lrbox.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">

        <a-video opacity="1" id="MindAR_feed" position="0 0 -15000" width="20000" height="20000"></a-video>

        <a-entity mindar-image-target="targetIndex: 0">
          <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.15 0.15 0.15" src="#lrbox">
        </a-entity>

      </a-camera>


      <script>



            document.addEventListener("DOMContentLoaded", () => {
                setTimeout(() => {
                    const mindarVideo = document.querySelectorAll('video')[0];
                    mindarVideo.id = "mindar";
                    if (mindarVideo && mindarVideo.srcObject) {
                        mindarVideo.style.visibility = 'hidden';
                        const arFeed = document.getElementById('MindAR_feed');
                        arFeed.srcObject = mindarVideo.srcObject;
                        arFeed.setAttribute('src', '#mindar');
                    }
                }, 3000);
            });


        </script>


    </a-scene>
  </body>
</html>
