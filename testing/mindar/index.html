<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Screen AR Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Ensure canvas is on top of video elements */
        .a-canvas {
            z-index: 1 !important;
            position: absolute !important;
        }
    </style>


</head>

<body>
    <a-scene mindar-image="uiScanning:no; uiLoading:no; imageTargetSrc: minds/targets.mind; maxTrack: 1"
        vr-mode-ui="enabled: true" xr-mode-ui="enabled: true" device-orientation-permission-ui="enabled: false">

        <a-camera rotation="0 0 0" position="0 0 0" look-controls="enabled: false">
            <a-video opacity="1" id="MindAR_feed" position="0 0 -11000" width="20000" height="20000"></a-video>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box color="red" position="0 0 0" height="1" depth="0.3" width="1" rotation="0 0 0"></a-box>
            </a-entity>
        </a-camera>

        <a-box color="blue" position="0 0 -11" height="0.5" depth="0.5" width="0.5" rotation="0 0 0"></a-box>



        <script>
            function getColorByIndex(index) {
                const hue = (index * 137.508) % 360;
                return `hsl(${hue}, 70%, 60%)`;
            }

            document.addEventListener("DOMContentLoaded", () => {
                setTimeout(() => {
                    const mindarVideo = document.querySelector('video');
                    mindarVideo.id = "mindar";
                    if (mindarVideo && mindarVideo.srcObject) {
                        mindarVideo.style.visibility = 'hidden';
                        const arFeed = document.getElementById('MindAR_feed');
                        arFeed.srcObject = mindarVideo.srcObject;
                        arFeed.setAttribute('src', '#mindar');
                    }
                }, 3000);
            });



        </script>
    </a-scene>
</body>

</html>
